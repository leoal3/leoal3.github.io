<html lang="zh-CN">

    <title>Vocabulary Trainer（静态版）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f1;
        --surface: #ffffff;
        --surface-2: #eceee9;
        --ink: #1b1e1c;
        --muted: #68706a;
        --line: #dde0d8;
        --accent: #0d6e5f;
        --accent-ink: #ffffff;
        --stubborn: #b34a12;
        --stubborn-bg: #fdf0e6;
        --flame: #d97b06;
        --chip-on: #1b1e1c;
        --chip-on-ink: #f5f5f1;
        --shadow: 0 1px 2px rgba(27, 30, 28, .06), 0 4px 14px rgba(27, 30, 28, .05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101312;
          --surface: #1a1e1b;
          --surface-2: #232825;
          --ink: #eceee9;
          --muted: #9aa39c;
          --line: #2e332f;
          --accent: #3cbfa8;
          --accent-ink: #0c1210;
          --stubborn: #f09a5c;
          --stubborn-bg: #2c2019;
          --flame: #f0a63c;
          --chip-on: #eceee9;
          --chip-on-ink: #101312;
          --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 14px rgba(0, 0, 0, .3);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        line-height: 1.5;
      }
      .wrap { max-width: 680px; margin: 0 auto; padding: 18px 16px 40px; }

      /* ---------- dashboard ---------- */
      .dash {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 20px 20px 16px;
      }
      .streak-row { display: flex; align-items: center; gap: 14px; }
      .flame-badge {
        flex: none; width: 52px; height: 52px; border-radius: 50%;
        background: var(--stubborn-bg);
        display: flex; align-items: center; justify-content: center;
      }
      .flame-badge svg { width: 28px; height: 28px; fill: var(--flame); }
      .streak-num {
        font-family: "Newsreader", Georgia, "Times New Roman", serif;
        font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -0.01em;
      }
      .streak-unit { font-size: 20px; font-weight: 600; margin-left: 2px; }
      .streak-label { margin-left: auto; text-align: right; }
      .streak-label .t { font-size: 15px; font-weight: 600; }
      .streak-label .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
      .strip { display: flex; gap: 5px; margin: 18px 0 4px; }
      .strip .cell {
        flex: 1; height: 26px; border-radius: 5px; background: var(--surface-2);
        display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px;
        font-size: 9.5px; color: var(--muted);
      }
      .strip .cell.on { background: var(--accent); color: var(--accent-ink); }
      .strip .cell.today { outline: 2px solid var(--accent); outline-offset: -2px; }
      .strip-cap { font-size: 11.5px; color: var(--muted); margin: 2px 0 0; }
      .stats { display: flex; gap: 10px; margin-top: 16px; }
      .stat {
        flex: 1; background: var(--surface-2); border: 1px solid transparent;
        border-radius: 8px; padding: 10px 6px; text-align: center;
        font: inherit; color: inherit; cursor: default;
      }
      button.stat { cursor: pointer; }
      button.stat:active { border-color: var(--stubborn); }
      .stat b { display: block; font-family: "Newsreader", Georgia, serif; font-size: 26px; font-weight: 700; line-height: 1.15; }
      .stat span { font-size: 12.5px; color: var(--muted); }
      .stat.stub b { color: var(--stubborn); }

      /* ---------- toolbar ---------- */
      .toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 8px; }
      .search {
        display: flex; align-items: center; gap: 8px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
        padding: 0 12px; box-shadow: var(--shadow);
      }
      .search svg { flex: none; width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 2; }
      .search input {
        flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink);
        font: inherit; font-size: 16px; padding: 11px 0;
      }
      .search input::placeholder { color: var(--muted); }
      .exports { display: flex; gap: 8px; margin-top: 10px; }
      .exports button, .chips button {
        font: inherit; font-size: 13.5px; cursor: pointer;
        border: 1px solid var(--line); background: var(--surface); color: var(--ink);
        border-radius: 999px; padding: 7px 14px;
      }
      .exports button:active { background: var(--surface-2); }
      .chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .chips button.on { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); font-weight: 600; }
      .chips button.stub.on { background: var(--stubborn); border-color: var(--stubborn); color: #fff; }

      .result-count { font-size: 12.5px; color: var(--muted); margin: 14px 2px 8px; }

      /* ---------- word list ---------- */
      .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .row {
        background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
        box-shadow: var(--shadow); overflow: hidden;
      }
      .row-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
      .row-main { flex: 1; min-width: 0; }
      .word {
        font-family: "Newsreader", Georgia, "Times New Roman", serif;
        font-size: 21px; font-weight: 600; line-height: 1.25; overflow-wrap: break-word;
      }
      .meaning { font-size: 14.5px; color: var(--ink); margin-top: 1px; overflow-wrap: break-word; }
      .meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .badge-stub {
        color: var(--stubborn); background: var(--stubborn-bg); border-radius: 4px;
        padding: 0 6px; font-size: 11.5px; font-weight: 600; line-height: 1.7;
      }
      .speak {
        flex: none; width: 38px; height: 38px; border-radius: 50%;
        border: 1px solid var(--line); background: var(--surface); cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .speak svg { width: 18px; height: 18px; fill: var(--accent); }
      .speak:active { background: var(--surface-2); }
      .chev { flex: none; width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform .18s ease; }
      .row.open .chev { transform: rotate(180deg); }
      .detail { display: none; border-top: 1px dashed var(--line); padding: 12px 14px 14px; font-size: 14px; }
      .row.open .detail { display: block; }
      .detail .ex {
        font-family: "Newsreader", Georgia, serif; font-size: 16.5px; font-style: italic; line-height: 1.45;
      }
      .detail .lab { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted); margin: 10px 0 3px; }
      .detail .lab:first-child { margin-top: 0; }
      .detail .ety { color: var(--ink); line-height: 1.6; }
      .detail .plain { color: var(--muted); font-size: 13px; }
      .empty { text-align: center; color: var(--muted); padding: 36px 0; font-size: 14.5px; }
      footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); }
      @media (min-width: 560px) {
        .wrap { padding-top: 26px; }
        .streak-num { font-size: 60px; }
      }
    </style>
  </head>

      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
          <input id="q" type="search" placeholder="搜索单词或中文释义…" autocomplete="off" />

        <div class="exports">

          <button type="button" id="expCsv">导出 CSV</button>

        <nav class="chips" aria-label="筛选">
          <button type="button" data-view="all" class="on">全部</button>
          <button type="button" data-view="stubborn" class="stub">顽固错词</button>
          <button type="button" data-view="week">本周新增</button>
        </nav>
      </div>

      <p class="result-count" id="resultCount"></p>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>没有匹配的词，换个关键词试试。</p>

      <footer>词库快照 · 更新于 2026 年 10 月 20 日</footer>
    </div>

:"derive","meaning":"源于，起源于；获得","added":"2026-10-15","streak":0},{"word":"prevent","meaning":"预防，防止","added":"2026-10-15","streak":0},{"word":"deter","meaning":"阻止；威慑","added":"2026-10-15","streak":0},{"word":"deviate","meaning":"偏离，背离","added":"2026-10-15","streak":0},{"word":"devise","meaning":"设计，发明","added":"2026-10-15","streak":0},{"word":"detach","meaning":"分开，拆离","added":"2026-10-15","streak":0},{"word":"drastic","meaning":"极端的，激烈的，严厉的","added":"2026-10-15","streak":0},{"word":"duplicate","meaning":"复制的；复制","added":"2026-10-15","streak":0},{"word":"replicate","meaning":"复制，复现","added":"2026-10-15","streak":0},{"word":"naive","meaning":"天真的，幼稚的","added":"2026-10-15","streak":0},{"word":"prone","meaning":"易于……的","added":"2026-10-15","streak":0},{"word":"precede","meaning":"先于……发生","added":"2026-10-15","streak":0},{"word":"toll","meaning":"通行费；伤亡人数，代价","added":"2026-10-15","streak":0},{"word":"supplicate","meaning":"恳求，哀求","added":"2026-10-15","streak":0},{"word":"recede","meaning":"后退；减弱","added":"2026-10-15","streak":0},{"word":"precedent","meaning":"先例","added":"2026-10-15","streak":0},{"word":"innate","meaning":"天生的，先天的","added":"2026-10-15","streak":0},{"word":"freelance","meaning":"自由职业的；从事自由职业","added":"2026-10-18","streak":0},{"word":"pipeline","meaning":"管道；输油管","added":"2026-10-18","streak":0},{"word":"outreach","meaning":"拓展服务；外展","added":"2026-10-18","streak":0},{"word":"liberal","meaning":"开明的；自由的","added":"2026-10-18","streak":0},{"word":"disseminate","meaning":"传播；散布","added":"2026-10-18","streak":0},{"word":"conscientious","meaning":"认真的；尽责的","added":"2026-10-18","streak":0},{"word":"lodge","meaning":"寄宿；乡间小屋","added":"2026-10-18","streak":0},{"word":"banquet","meaning":"宴会","added":"2026-10-18","streak":0},{"word":"deficit","meaning":"赤字；亏损","added":"2026-10-18","streak":0},{"word":"deem","meaning":"认为；视为","added":"2026-10-18","streak":0},{"word":"preclude","meaning":"阻止；排除","added":"2026-10-18","streak":0},{"word":"endow","meaning":"赋予；捐赠","added":"2026-10-18","streak":0},{"word":"endorse","meaning":"赞同；支持","added":"2026-10-18","streak":0},{"word":"confer","meaning":"授予；商议","added":"2026-10-18","streak":0},{"word":"foremost","meaning":"最重要的；首要的","added":"2026-10-18","streak":0},{"word":"precarious","meaning":"不稳定的；危险的","added":"2026-10-18","streak":0},{"word":"handicap","meaning":"障碍；不利条件","added":"2026-10-18","streak":0},{"word":"extinguish","meaning":"熄灭；扑灭","added":"2026-10-18","streak":0},{"word":"nudge","meaning":"轻推；推动","added":"2026-10-18","streak":0},{"word":"Celsius","meaning":"摄氏的","added":"2026-10-18","streak":0},{"word":"lottery","meaning":"彩票；抽奖","added":"2026-10-18","streak":0},{"word":"spouse","meaning":"配偶","added":"2026-10-18","streak":0},{"word":"vendor","meaning":"小贩；供应商","added":"2026-10-18","streak":0},{"word":"overflow","meaning":"溢出；充满","added":"2026-10-18","streak":0},{"word":"immune","meaning":"免疫的；不受影响的","added":"2026-10-18","streak":0}];
      var ACTIVITY = ["2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17","2026-10-18","2026-10-19"];
      var STUBBORN = {
        "refute": {
          "errors": 3,
          "example": "The scientist refuted the claim with fresh data.",
          "etymology": "拉丁语 refutare「打回去」：re-（往回）+ futare（击打）。把对方的论点「打回去」，就是驳斥；同根的 irrefutable 就是「打不回去的」，即无可辩驳。"
        },
        "defy": {
          "errors": 1,
          "example": "The climbers defied the storm and pushed on to the summit.",
          "etymology": "古法语 desfier「挑战」：de-（脱离）+ fier（信任，源自拉丁语 fid-「信」）。字面是撕毁信任、翻脸挑战，引申为公然违抗；同根词有 confident（自信）、fidelity（忠诚）。"
        }
      };

      function dstr(d) {
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return d.getFullYear() + "-" + m + "-" + day;
      }
      function parseD(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
      function mdLabel(s) { var p = s.split("-"); return (+p[1]) + "月" + (+p[2]) + "日"; }

      /* ---- streak ---- */
      var actSet = {};
      ACTIVITY.forEach(function (s) { actSet[s] = true; });
      var lastAct = ACTIVITY[ACTIVITY.length - 1];
      var streak = 0;
      (function () {
        var cur = parseD(lastAct);
        while (actSet[dstr(cur)]) { streak++; cur.setDate(cur.getDate() - 1); }
      })();
      document.getElementById("streakNum").textContent = streak;
      document.getElementById("streakSub").textContent = "最近学习日 " + mdLabel(lastAct);

      /* ---- 14-day strip ---- */
      var strip = document.getElementById("strip");
      (function () {
        var end = parseD(SNAPSHOT);
        for (var i = 13; i >= 0; i--) {
          var d = new Date(end); d.setDate(d.getDate() - i);
          var s = dstr(d);
          var cell = document.createElement("div");
          cell.className = "cell" + (actSet[s] ? " on" : "") + (s === SNAPSHOT ? " today" : "");
          cell.textContent = d.getDate();
          strip.appendChild(cell);
        }
      })();

      /* ---- stats ---- */
      var weekStart = (function () { var d = parseD(SNAPSHOT); d.setDate(d.getDate() - 6); return dstr(d); })();
      function isWeek(w) { return w.added >= weekStart && w.added <= SNAPSHOT; }
      var stubWords = WORDS.filter(function (w) { return STUBBORN[w.word]; });
      document.getElementById("statTotal").textContent = WORDS.length;
      document.getElementById("statStubN").textContent = stubWords.length;
      document.getElementById("statWeek").textContent = WORDS.filter(isWeek).length;

      /* ---- rendering ---- */
      var listEl = document.getElementById("list");
      var emptyEl = document.getElementById("empty");
      var countEl = document.getElementById("resultCount");
      var view = "all";
      var query = "";

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function rowHTML(w) {
        var stub = STUBBORN[w.word];
        var meta = "添加 " + mdLabel(w.added);
        if (typeof w.streak === "number" && w.streak > 0) meta += " · 连对 " + w.streak + " 次";
        if (stub) meta = '<span class="badge-stub">顽固词 · 答错 ' + stub.errors + ' 次</span>' + meta;
        var detail = "";
        if (stub) {
          detail = '<div class="lab">例句</div><div class="ex">' + esc(stub.example) + '</div>' +
                   '<div class="lab">词根词缀</div><div class="ety">' + esc(stub.etymology) + '</div>';
        } else {
          detail = '<div class="plain">例句与词根词缀陆续补充中，先补顽固词和高频词。</div>';
        }
        return '<li class="row' + (view === "stubborn" ? " open" : "") + '" data-word="' + esc(w.word) + '">' +
          '<div class="row-head">' +
            '<div class="row-main">' +
              '<div class="word">' + esc(w.word) + '</div>' +
              '<div class="meaning">' + esc(w.meaning) + '</div>' +
              '<div class="meta">' + meta + '</div>' +
            '</div>' +
            '<button class="speak" type="button" aria-label="朗读 ' + esc(w.word) + '">' +
              '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.6a4.5 4.5 0 0 1 0 6.8l-1-1.2a3.2 3.2 0 0 0 0-4.4l1-1.2z"/><path d="M18.6 6a8 8 0 0 1 0 12l-1-1.2a6.6 6.6 0 0 0 0-9.6l1-1.2z"/></svg>' +
            '</button>' +
            '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>' +
          '</div>' +
          '<div class="detail">' + detail + '</div>' +
        '</li>';
      }

      function render() {
        var items = WORDS.slice();
        if (view === "stubborn") items = items.filter(function (w) { return STUBBORN[w.word]; });
        if (view === "week") items = items.filter(isWeek);
        if (query) {
          var q = query.toLowerCase();
          items = items.filter(function (w) {
            return w.word.toLowerCase().indexOf(q) !== -1 || w.meaning.indexOf(query) !== -1;
          });
        }
        items.sort(function (a, b) {
          var ea = STUBBORN[a.word] ? STUBBORN[a.word].errors : 0;
          var eb = STUBBORN[b.word] ? STUBBORN[b.word].errors : 0;
          if (view === "stubborn" && eb !== ea) return eb - ea;
          if (b.added !== a.added) return b.added < a.added ? -1 : 1;
          return a.word < b.word ? -1 : 1;
        });
        listEl.innerHTML = items.map(rowHTML).join("");
        emptyEl.hidden = items.length > 0;
        var label = view === "stubborn" ? "顽固错词" : view === "week" ? "本周新增" : "全部单词";
        countEl.textContent = label + " · " + items.length + " 个";
      }

      listEl.addEventListener("click", function (e) {
        var speakBtn = e.target.closest(".speak");
        var row = e.target.closest(".row");
        if (speakBtn && row) {
          e.stopPropagation();
          speak(row.getAttribute("data-word"));
          return;
        }
        if (row && e.target.closest(".row-head")) row.classList.toggle("open");
      });

      function speak(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "en-GB";
        u.rate = 0.92;
        window.speechSynthesis.speak(u);
      }

      /* ---- filters ---- */
      var chips = document.querySelectorAll(".chips button");
      function setView(v) {
        view = v;
        chips.forEach(function (c) { c.classList.toggle("on", c.getAttribute("data-view") === v); });
        render();
      }
      chips.forEach(function (c) {
        c.addEventListener("click", function () { setView(c.getAttribute("data-view")); });
      });
      document.getElementById("statStubborn").addEventListener("click", function () {
        setView("stubborn");
        document.querySelector(".toolbar").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      document.getElementById("q").addEventListener("input", function (e) {
        query = e.target.value.trim();
        render();
      });

      /* ---- export ---- */
      function download(name, text, type) {
        var blob = new Blob([text], { type: type });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 800);
      }
      document.getElementById("expJson").addEventListener("click", function () {
        download("vocabulary-" + SNAPSHOT + ".json",
          JSON.stringify({ exported: SNAPSHOT, words: WORDS }, null, 2),
          "application/json");
      });
      document.getElementById("expCsv").addEventListener("click", function () {
        var lines = ["word,meaning,added,streak"];
        WORDS.forEach(function (w) {
          function cell(s) { return '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"'; }
          lines.push([cell(w.word), cell(w.meaning), cell(w.added), cell(w.streak)].join(","));
        });
        download("vocabulary-" + SNAPSHOT + ".csv", "\ufeff" + lines.join("\r\n"), "text/csv");
      });

      render();
    </script>
  </body>
</html>
